      <button id="toggleTheme" class="btn-icon" title="Cambiar tema">🌙</button>

  <section class="stats">
    <div class="stat-card" data-estado=""><div class="stat-num" id="statTotal">0</div><div class="stat-label">Total</div></div>
    <div class="stat-card" data-estado="no_iniciado"><div class="stat-num" id="statNoIniciado">0</div><div class="stat-label">No iniciado</div></div>
    <div class="stat-card" data-estado="iniciado"><div class="stat-num" id="statIniciado">0</div><div class="stat-label">Iniciado</div></div>
    <div class="stat-card" data-estado="en_proceso"><div class="stat-num" id="statProceso">0</div><div class="stat-label">En proceso</div></div>
    <div class="stat-card" data-estado="terminado"><div class="stat-num" id="statTerminado">0</div><div class="stat-label">Terminado</div></div>
  </section>

  <section class="toolbar">
    <input type="search" id="searchInput" placeholder="Buscar nombre, DNI, teléfono, email…">
    <select id="filterEstado">
      <option value="">Todos los estados</option>
      <option value="no_iniciado">No iniciado</option>
      <option value="iniciado">Iniciado</option>
      <option value="en_proceso">En proceso</option>
      <option value="terminado">Terminado</option>
    </select>
    <select id="filterAgente"><option value="">Todos los agentes</option></select>
    <select id="filterRiesgo">
      <option value="">Riesgo: todos</option>
      <option value="true">Solo con riesgo</option>
      <option value="false">Sin riesgo</option>
    </select>
    <button id="refreshBtn" class="btn-ghost">↻ Recargar</button>
  </section>

  <section class="table-wrap">
    <table class="data-table">
      <thead>
        <tr>
          <th>Fecha</th><th>Cliente</th><th>Contacto</th><th>Tarifa</th>
          <th>Estado</th><th>Agente</th><th>Riesgo</th><th></th>
        </tr>
      </thead>
      <tbody id="tbody"><tr><td colspan="8" class="empty">Cargando…</td></tr></tbody>
    </table>
  </section>
</div>

<!-- ───────── MODAL ───────── -->
<div id="modal" class="modal" style="display:none;">
  <div class="modal-content">
    <button class="modal-close" id="modalClose">×</button>
    <h2 id="modalTitle">Contratación</h2>

    <!-- Gestión de proceso destacada arriba -->
    <div class="process-box">
      <div class="process-field">
        <label>Estado del proceso</label>
        <select id="modalEstado">
          <option value="no_iniciado">No iniciado</option>
          <option value="iniciado">Iniciado</option>
          <option value="en_proceso">En proceso</option>
          <option value="terminado">Terminado</option>
        </select>
      </div>
      <div class="process-field">
        <label>Agente responsable</label>
        <input type="text" id="modalAgente" placeholder="Nombre del agente">
      </div>
      <div class="process-field full">
        <label>Notas internas</label>
        <textarea id="modalNotas" rows="2" placeholder="Notas del equipo (no visibles para el cliente)"></textarea>
      </div>
      <button id="modalSave" class="btn-primary">Guardar cambios</button>
      <button id="modalDelete" class="btn-danger" style="display:none;">🗑 Borrar</button>
    </div>

    <div id="modalBody"></div>

    <details class="historial-wrap">
      <summary>Ver historial de cambios</summary>
      <div id="historialBody" class="historial-body">—</div>
    </details>
  </div>
</div>

<div id="toastContainer" class="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
